name: Daily Product Picker Compose

on:
  workflow_dispatch:
    inputs:
      discovery_date:
        description: "Optional Asia/Shanghai business date override"
        required: false
        default: ""
  schedule:
    # 05:00 UTC is 13:00 Asia/Shanghai.
    - cron: "0 5 * * *"

concurrency:
  group: daily-product-picker-compose
  cancel-in-progress: false

jobs:
  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Compose persisted Daily and notify
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DAILY_FALLBACK_ENABLED: "false"
          PRODUCT_PICKER_DISCOVERY_DATE: ${{ github.event_name == 'workflow_dispatch' && inputs.discovery_date || '' }}
          EVIDENCE_FIRST_WXPUSHER_ENABLED: "true"
          WXPUSHER_APP_TOKEN: ${{ secrets.WXPUSHER_APP_TOKEN }}
          WXPUSHER_UID: ${{ secrets.WXPUSHER_UID }}
        run: python -u compose_daily.py
