name: Daily Product Picker

on:
  workflow_dispatch:
    inputs:
      max_daily_triage_calls:
        description: "Gemini Cheap Triage call limit for this manual run"
        required: false
        default: "5"
  schedule:
    # 23:00 UTC is 08:00 JST on the following calendar day.
    - cron: "0 23 * * *"

concurrency:
  group: daily-product-picker
  cancel-in-progress: false

jobs:
  daily:
    # Scheduled runs remain defined but are paused unless the repository variable
    # is explicitly enabled. Manual production tests continue to work.
    if: github.event_name == 'workflow_dispatch' || vars.DAILY_SCHEDULE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install runtime dependencies
        run: pip install -r requirements.txt
      - name: Run daily pipeline
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_TRIAGE_MODEL: gemini-3.5-flash-lite
          DAILY_SCHEDULE_ENABLED: ${{ vars.DAILY_SCHEDULE_ENABLED || 'false' }}
          PRODUCTION_DAILY: "true"
          MAX_DAILY_TRIAGE_CALLS: ${{ github.event_name == 'workflow_dispatch' && inputs.max_daily_triage_calls || '30' }}
        run: python run_daily.py
