name: Daily Product Picker

on:
  workflow_dispatch:
    inputs:
      max_daily_triage_calls:
        description: "Gemini Cheap Triage call limit for this manual run"
        required: false
        default: "5"
      notification_test_only:
        description: "Send only the WxPusher connectivity test (no scraping or Gemini)"
        required: false
        type: boolean
        default: false
  schedule:
    # 23:00 UTC is 08:00 JST on the following calendar day.
    - cron: "0 23 * * *"

concurrency:
  group: daily-product-picker
  cancel-in-progress: false

jobs:
  daily:
    # This is the single authoritative scheduled Product Picker pipeline.
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install runtime dependencies
        run: pip install -r requirements.txt
      - name: Test WxPusher notification only
        if: github.event_name == 'workflow_dispatch' && inputs.notification_test_only == true
        env:
          WXPUSHER_APP_TOKEN: ${{ secrets.WXPUSHER_APP_TOKEN }}
          WXPUSHER_UID: ${{ secrets.WXPUSHER_UID }}
        run: python -m wxpusher_notifier --test
      - name: Run daily pipeline
        if: github.event_name == 'schedule' || inputs.notification_test_only != true
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_TRIAGE_MODEL: gemini-3.5-flash-lite
          DAILY_SCHEDULE_ENABLED: "true"
          PRODUCTION_DAILY: "true"
          MAX_DAILY_TRIAGE_CALLS: ${{ github.event_name == 'workflow_dispatch' && inputs.max_daily_triage_calls || '30' }}
          EVIDENCE_FIRST_WXPUSHER_ENABLED: "true"
          WXPUSHER_APP_TOKEN: ${{ secrets.WXPUSHER_APP_TOKEN }}
          WXPUSHER_UID: ${{ secrets.WXPUSHER_UID }}
        run: python run_daily.py
