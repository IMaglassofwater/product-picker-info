name: Product Picker Background Collection

on:
  workflow_dispatch:
  schedule:
    # 20:00, 04:00 and 12:00 Asia/Shanghai; the last run covers the noon cutoff.
    - cron: "0 4,12,20 * * *"

concurrency:
  group: product-picker-background-collection
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Collect and persist evidence only
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_TRIAGE_MODEL: gemini-3.5-flash-lite
          PRODUCTION_DAILY: "true"
          EVIDENCE_FIRST_WXPUSHER_ENABLED: "false"
        run: python -u run_collection.py
